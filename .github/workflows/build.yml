name: Build steveOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out steveOS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install UEFI build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils gnu-efi python3 python3-pil mtools dosfstools cpio gzip grub-efi-amd64-bin grub-common curl proot

      - name: Validate Server Mode script
        run: sh -n tools/build_server_runtime.sh

      - name: Validate Python desktop tools
        run: |
          python3 -m py_compile tools/prepare_desktop.py tools/fix_desktop_decls.py tools/add_crd_gui.py

      - name: Build Server Mode runtime
        run: sh tools/build_server_runtime.sh

      - name: Normalise desktop build pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Makefile')
          s = p.read_text()
          good = '''\tpython3 tools/prepare_desktop.py\n\tpython3 tools/fix_desktop_decls.py\n\t$(PYTHON) tools/add_crd_gui.py'''
          old = '''\tpython3 tools/fix_desktop_decls.py\n\tpython3 tools/prepare_desktop.py\n\t$(PYTHON) tools/add_crd_gui.py'''
          if old in s:
              s = s.replace(old, good, 1)
              p.write_text(s)
          elif good not in s:
              raise SystemExit('desktop build recipe is not in a recognised safe order')
          PY

      - name: Build BOOTX64.EFI
        run: make PYTHON=python3

      - name: Assemble bootable USB image
        run: |
          mkdir -p usb/EFI/BOOT usb/Apps usb/SteveOS/Server
          cp build/BOOTX64.EFI usb/EFI/BOOT/BOOTX64.EFI
          cp build/apps/Hello.efi usb/Apps/Hello.efi
          cp build/server/ServerBoot.efi usb/SteveOS/Server/ServerBoot.efi
          cp build/server/vmlinuz-lts usb/SteveOS/Server/vmlinuz-lts
          cp build/server/server-initramfs.img usb/SteveOS/Server/server-initramfs.img
          cp build/server/rootfs/etc/steveos/server.conf usb/SteveOS/Server/server.conf
          truncate -s 2G steveOS.img
          mkfs.fat -F 32 steveOS.img
          mcopy -s -i steveOS.img usb/* ::/

      - name: Upload steveOS build
        uses: actions/upload-artifact@v4
        with:
          name: steveOS-boot
          path: |
            build/BOOTX64.EFI
            steveOS.img
