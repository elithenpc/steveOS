name: Build steveOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out steveOS
        uses: actions/checkout@v4

      - name: Install UEFI build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils gnu-efi python3 python3-pil mtools

      - name: Build BOOTX64.EFI
        run: make

      - name: Assemble bootable USB image
        run: |
          mkdir -p usb/EFI/BOOT
          cp build/BOOTX64.EFI usb/EFI/BOOT/BOOTX64.EFI
          truncate -s 64M steveOS.img
          mkfs.fat -F 32 steveOS.img
          mcopy -s -i steveOS.img usb/* ::/

      - name: Upload steveOS build
        uses: actions/upload-artifact@v4
        with:
          name: steveOS-boot
          path: |
            build/BOOTX64.EFI
            steveOS.img
