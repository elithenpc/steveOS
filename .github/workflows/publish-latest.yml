name: Publish SteveOS Latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out steveOS
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install UEFI build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils gnu-efi python3 python3-pil mtools dosfstools cpio gzip grub-efi-amd64-bin grub-common curl proot

      - name: Build Server Mode runtime
        run: sh tools/build_server_runtime.sh

      - name: Build BOOTX64.EFI
        run: make

      - name: Assemble bootable USB image
        run: |
          mkdir -p usb/EFI/BOOT usb/Apps usb/SteveOS/Server
          cp build/BOOTX64.EFI usb/EFI/BOOT/BOOTX64.EFI
          cp build/apps/Hello.efi usb/Apps/Hello.efi
          cp build/server/ServerBoot.efi usb/SteveOS/Server/ServerBoot.efi
          cp build/server/vmlinuz-lts usb/SteveOS/Server/vmlinuz-lts
          cp build/server/server-initramfs.img usb/SteveOS/Server/server-initramfs.img
          cp build/server/rootfs/etc/steveos/server.conf usb/SteveOS/Server/server.conf
          truncate -s 2G steveOS.img
          mkfs.fat -F 32 steveOS.img
          mcopy -s -i steveOS.img usb/* ::/

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest               build/BOOTX64.EFI               build/server/ServerBoot.efi               build/server/vmlinuz-lts               build/server/server-initramfs.img               steveOS.img               --clobber
            gh release edit latest               --title "SteveOS Latest"               --notes "Rolling build from the main branch. The SteveOS native Update Centre checks VERSION and downloads these assets."
          else
            gh release create latest               build/BOOTX64.EFI               build/server/ServerBoot.efi               build/server/vmlinuz-lts               build/server/server-initramfs.img               steveOS.img               --title "SteveOS Latest"               --notes "Rolling build from the main branch. The SteveOS native Update Centre checks VERSION and downloads these assets."
          fi
